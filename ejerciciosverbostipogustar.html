<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traduce y Ordena Oraciones</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FDFBF5; /* Light beige */
            color: #5D544C; /* Taupe */
        }
        .card {
            background-color: #FFFFFF;
            border: 1px solid #EAE5DE; /* Light grey-beige */
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            transition: all 0.3s ease;
        }
        .word-token-btn {
            background-color: #FDFBF5; /* Light beige, default button color */
            color: #5D544C; /* Taupe text */
            border: 1px solid #D4C9BF; /* Slightly darker beige border */
            border-radius: 0.5rem;
            padding: 0.5rem 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
            text-align: center;
            flex-shrink: 0; /* Prevent shrinking in flex container */
        }
        .word-token-btn:hover:not(.selected) {
            transform: translateY(-2px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .word-token-btn.selected {
            background-color: #F97316; /* Muted Orange for selected */
            color: #FFFFFF;
            border-color: #F97316;
        }
        .action-btn {
            background-color: #F97316;
            color: #FFFFFF;
            border-radius: 0.5rem;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }
        .action-btn:hover {
            background-color: #E05A00;
            transform: translateY(-1px);
        }
        .feedback-message {
            font-weight: 600;
            margin-top: 1rem;
            min-height: 1.5rem;
        }
        .sentence-builder-area {
            min-height: 80px;
            border: 2px dashed #D4C9BF;
            border-radius: 0.5rem;
            padding: 0.75rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-content: flex-start; /* Align items to the start of the cross axis */
        }
        .scrambled-words-container {
            min-height: 80px;
            border: 2px dashed #EAE5DE;
            border-radius: 0.5rem;
            padding: 0.75rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-content: flex-start;
        }
        .correct-answer-display {
            background-color: #E6FFFA; /* Light Teal */
            color: #008080; /* Dark Teal */
            border: 1px solid #4CAF50;
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-top: 1rem;
            font-weight: 500;
        }
    </style>
</head>
<body class="antialiased flex items-center justify-center min-h-screen p-4">

    <div class="container mx-auto max-w-3xl">
        <div class="card p-6 md:p-8">
            <h1 class="text-3xl md:text-4xl font-bold mb-6 text-center text-orange-600">¡Traduce y Ordena!</h1>
            <p class="mb-8 text-lg text-gray-600 text-center">Reordena las palabras en español para traducir la oración en inglés.</p>

            <div class="space-y-6">
                <div class="bg-blue-50 p-4 rounded-lg border border-blue-200">
                    <p class="text-xl font-semibold text-blue-800 mb-2">Oración en inglés:</p>
                    <p id="english-sentence" class="text-2xl font-bold text-blue-900"></p>
                </div>

                <div>
                    <p class="text-lg font-semibold text-gray-700 mb-2">Palabras desordenadas:</p>
                    <div id="scrambled-words-container" class="scrambled-words-container">
                        </div>
                </div>

                <div>
                    <p class="text-lg font-semibold text-gray-700 mb-2">Construye tu oración en español aquí:</p>
                    <div id="sentence-builder-area" class="sentence-builder-area">
                        </div>
                </div>

                <div class="flex justify-center gap-4 mt-6">
                    <button id="check-button" class="action-btn">Comprobar</button>
                    <button id="reset-current-button" class="action-btn bg-gray-500 hover:bg-gray-600">Reiniciar</button>
                    <button id="next-sentence-button" class="action-btn bg-green-600 hover:bg-green-700">Siguiente Oración</button>
                </div>

                <div id="feedback-message" class="feedback-message text-center"></div>

                <div id="correct-answer-display" class="correct-answer-display hidden">
                    <p class="font-semibold text-teal-800">Respuesta correcta:</p>
                    <p id="correct-spanish-sentence" class="text-xl text-teal-900"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sentencesData = [
                { english: "I like the cinema.", correctSpanish: "Me gusta el cine." },
                { english: "I like books.", correctSpanish: "Me gustan los libros." },
                { english: "Juan likes soccer.", correctSpanish: "A Juan le gusta el fútbol." },
                { english: "We like animals.", correctSpanish: "A nosotros nos gustan los animales." },
                { english: "She likes coffee.", correctSpanish: "A ella le gusta el café." },
                { english: "We don't like action movies.", correctSpanish: "A nosotros no nos gustan las películas de acción." },
                { english: "I don't like coffee.", correctSpanish: "A mí no me gusta el café." },
                { english: "They don't like adventure books.", correctSpanish: "A ellos no les gustan los libros de aventuras." },
                { english: "He loves sunny days.", correctSpanish: "A él le encantan los días soleados." },
                { english: "Mosquitoes bother you.", correctSpanish: "A ti te molestan los mosquitos." },
                { english: "Noise bothers me.", correctSpanish: "A mí me molesta el ruido." },
                { english: "They are interested in traveling to unknown places.", correctSpanish: "A ellos les interesa viajar a lugares desconocidos." },
                { english: "You are interested in learning to play the guitar.", correctSpanish: "A ti te interesa aprender a tocar la guitarra." },
                { english: "The environment is important to us.", correctSpanish: "A nosotros nos importa el medio ambiente." },
                { english: "The safety of your loved ones worries you.", correctSpanish: "A ustedes les preocupa la seguridad de sus seres queridos." },
                { english: "Staying alone for a long time depresses him.", correctSpanish: "A él le deprime quedarse solo por mucho tiempo." },
                { english: "Receiving unexpected bad news saddens her.", correctSpanish: "A ella le entristece recibir una mala noticia inesperada." },
                { english: "You (formal) like traveling.", correctSpanish: "A usted le gusta viajar." },
                { english: "I like music, but my brother doesn't.", correctSpanish: "A mí me gusta la música, pero a mi hermano no." },
                { english: "Pedro likes to read, but books bore Ana.", correctSpanish: "A Pedro le gusta leer, pero a Ana le aburren los libros." },
                { english: "Maria likes the flower.", correctSpanish: "A María le gusta la flor." },
                { english: "They like the movies.", correctSpanish: "A ellos les gustan las películas." },
                { english: "I like cats.", correctSpanish: "A mí me gustan los gatos." },
                { english: "We like to play soccer.", correctSpanish: "A nosotros nos gusta jugar fútbol." },
                { english: "They like to walk in the afternoon.", correctSpanish: "A ellos les gusta caminar en la tarde." },
                { english: "You are worried about not arriving on time for the meeting.", correctSpanish: "A ti te preocupa no llegar a tiempo a la reunión." },
                { english: "It makes me happy to see you happy.", correctSpanish: "A mí me alegra verte feliz." },
                { english: "Darkness scares you.", correctSpanish: "A ti te asusta la oscuridad." },
                { english: "Saying goodbye to their friends saddens them.", correctSpanish: "A ellos les entristece despedirse de sus amigos." },
                { english: "Hearing strange noises at night scares us.", correctSpanish: "A nosotros nos asusta escuchar ruidos extraños en la noche." }
            ];

            let currentSentenceIndex = 0;
            let currentScrambledWords = [];
            let builtSentenceWords = [];

            const englishSentenceDisplay = document.getElementById('english-sentence');
            const scrambledWordsContainer = document.getElementById('scrambled-words-container');
            const sentenceBuilderArea = document.getElementById('sentence-builder-area');
            const checkButton = document.getElementById('check-button');
            const resetCurrentButton = document.getElementById('reset-current-button');
            const nextSentenceButton = document.getElementById('next-sentence-button');
            const feedbackMessage = document.getElementById('feedback-message');
            const correctAnswerDisplay = document.getElementById('correct-answer-display');
            const correctSpanishSentenceDisplay = document.getElementById('correct-spanish-sentence');

            // Define verb pairs for singular/plural alternatives
            const verbPairs = [
                { singular: 'gusta', plural: 'gustan' },
                { singular: 'encanta', plural: 'encantan' },
                { singular: 'molesta', plural: 'molestan' },
                { singular: 'interesa', plural: 'interesan' },
                { singular: 'importa', plural: 'importan' },
                { singular: 'preocupa', plural: 'preocupan' },
                { singular: 'deprime', plural: 'deprimen' },
                { singular: 'entristece', plural: 'entristecen' },
                { singular: 'asusta', plural: 'asustan' },
                { singular: 'alegra', plural: 'alegran' }
            ];

            // Fisher-Yates shuffle algorithm
            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }

            // Function to render the scrambled word buttons
            function renderWords() {
                scrambledWordsContainer.innerHTML = ''; // Clear previous buttons
                currentScrambledWords.forEach((word, index) => {
                    const button = document.createElement('button');
                    button.className = 'word-token-btn';
                    button.textContent = word;
                    // Use a unique ID for each button instance to handle duplicates
                    button.dataset.id = `${word}-${index}-${Date.now()}`;
                    button.onclick = () => moveWordToBuilder(word, button);
                    scrambledWordsContainer.appendChild(button);
                });
            }

            // Function to move a word from scrambled container to builder area
            function moveWordToBuilder(word, button) {
                if (button.parentNode === scrambledWordsContainer) {
                    button.remove();
                    button.classList.add('selected');
                    button.onclick = () => moveWordToScrambled(word, button);
                    sentenceBuilderArea.appendChild(button);
                    builtSentenceWords.push({ word: word, id: button.dataset.id });
                }
            }

            // Function to move a word from builder area back to scrambled container
            function moveWordToScrambled(word, button) {
                if (button.parentNode === sentenceBuilderArea) {
                    button.remove();
                    button.classList.remove('selected');
                    button.onclick = () => moveWordToBuilder(word, button);
                    scrambledWordsContainer.appendChild(button);
                    builtSentenceWords = builtSentenceWords.filter(item => item.id !== button.dataset.id);
                }
            }

            // Function to load a new sentence
            function loadSentence() {
                if (currentSentenceIndex >= sentencesData.length) {
                    englishSentenceDisplay.textContent = "¡Has completado todas las oraciones!";
                    scrambledWordsContainer.innerHTML = '';
                    sentenceBuilderArea.innerHTML = '';
                    feedbackMessage.textContent = '¡Felicidades, eres un experto en verbos tipo gustar!';
                    feedbackMessage.style.color = '#F97316';
                    checkButton.disabled = true;
                    resetCurrentButton.disabled = true;
                    nextSentenceButton.disabled = true;
                    correctAnswerDisplay.classList.add('hidden');
                    return;
                }

                const sentence = sentencesData[currentSentenceIndex];
                englishSentenceDisplay.textContent = sentence.english;

                const spanishWordsOriginal = sentence.correctSpanish.split(' ');
                currentScrambledWords = [...spanishWordsOriginal];

                // Add singular/plural alternatives for all defined verb pairs
                verbPairs.forEach(pair => {
                    const hasSingular = currentScrambledWords.includes(pair.singular);
                    const hasPlural = currentScrambledWords.includes(pair.plural);

                    if (hasSingular && !hasPlural) {
                        currentScrambledWords.push(pair.plural);
                    } else if (hasPlural && !hasSingular) {
                        currentScrambledWords.push(pair.singular);
                    }
                });
                
                shuffleArray(currentScrambledWords); // Scramble them

                renderWords(); // Render the initial scrambled words
                sentenceBuilderArea.innerHTML = ''; // Clear builder area
                builtSentenceWords = []; // Reset built words array
                feedbackMessage.textContent = '';
                feedbackMessage.style.color = '';
                correctAnswerDisplay.classList.add('hidden');
                checkButton.disabled = false;
                resetCurrentButton.disabled = false;
                nextSentenceButton.disabled = false;
            }

            // Function to reset the current sentence's builder area and scrambled words
            function resetBuilderArea() {
                sentenceBuilderArea.innerHTML = '';
                builtSentenceWords = [];
                // Re-load the current sentence to re-scramble and reset the state
                loadSentence(); 
                feedbackMessage.textContent = '';
                feedbackMessage.style.color = '';
                correctAnswerDisplay.classList.add('hidden');
                document.querySelectorAll('.word-token-btn').forEach(btn => btn.disabled = false);
                checkButton.disabled = false;
            }

            // Function to check the user's answer
            function checkAnswer() {
                const currentSentence = sentencesData[currentSentenceIndex];
                const correctSpanish = currentSentence.correctSpanish;
                const userBuiltSpanish = builtSentenceWords.map(item => item.word).join(' ');

                correctAnswerDisplay.classList.remove('hidden');
                correctSpanishSentenceDisplay.textContent = correctSpanish;

                if (userBuiltSpanish === correctSpanish) {
                    feedbackMessage.textContent = '¡Correcto! ¡Excelente trabajo!';
                    feedbackMessage.style.color = '#008000'; // Green
                    document.querySelectorAll('.word-token-btn').forEach(btn => btn.disabled = true);
                    checkButton.disabled = true;
                    resetCurrentButton.disabled = true;
                } else {
                    feedbackMessage.textContent = 'Incorrecto. Inténtalo de nuevo o reinicia.';
                    feedbackMessage.style.color = '#FF0000'; // Red
                }
            }

            // Function to move to the next sentence
            function nextSentence() {
                currentSentenceIndex++;
                loadSentence();
            }

            // Event Listeners
            checkButton.addEventListener('click', checkAnswer);
            resetCurrentButton.addEventListener('click', resetBuilderArea);
            nextSentenceButton.addEventListener('click', nextSentence);

            // Initial load
            loadSentence();
        });
    </script>
</body>
</html>
